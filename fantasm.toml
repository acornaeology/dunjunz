# fantasm project configuration. See https://acornaeology.github.io/fantasm/
#
# One target per listing. Each separate program of a version has its own
# driver and listing; a game made of several DFS files is one target
# listing all of them under `images`, and verify compares each with the
# file of that name that the listing saves. beebasm runs in fantasm's
# temporary directory, so the saved files never land in the repository.

[project]
name = "dunjunz"
default_target = "swram_hack"

[binary]
cpu = "6502"

[verify]
command = ["beebasm", "-i", "{asm}"]
cwd = "{output_dirpath}"
output = "{image}"

# The 1986 cassette: the resident game (four files), TITLE, its title
# page, and Dunjunz1, its game loader.
[[targets]]
id = "tape"
images = [
  "versions/dunjunz-tape/binary/DUNK",
  "versions/dunjunz-tape/binary/Dunjunz4",
  "versions/dunjunz-tape/binary/Dunjunz5",
  "versions/dunjunz-tape/binary/Dunjunz3",
]
driver = "versions/dunjunz-tape/disassemble/disasm_dunjunz_tape.py"
asm = "versions/dunjunz-tape/output/dunjunz-tape.asm"
json = "versions/dunjunz-tape/output/dunjunz-tape.json"

[[targets]]
id = "tape-title"
binary = "versions/dunjunz-tape/binary/TITLE"
driver = "versions/dunjunz-tape/disassemble/disasm_dunjunz_tape_title.py"
asm = "versions/dunjunz-tape/output/dunjunz-tape-title.asm"
json = "versions/dunjunz-tape/output/dunjunz-tape-title.json"

[[targets]]
id = "tape-dunjunz1"
binary = "versions/dunjunz-tape/binary/Dunjunz1"
driver = "versions/dunjunz-tape/disassemble/disasm_dunjunz_tape_dunjunz1.py"
asm = "versions/dunjunz-tape/output/dunjunz-tape-dunjunz1.asm"
json = "versions/dunjunz-tape/output/dunjunz-tape-dunjunz1.json"

# The sideways RAM hack: the resident game (four files), and TITLE, its
# title page.
[[targets]]
id = "swram_hack"
images = [
  "versions/dunjunz-swram_hack/binary/Dunjun4",
  "versions/dunjunz-swram_hack/binary/Dunjun7",
  "versions/dunjunz-swram_hack/binary/Dunjun5",
  "versions/dunjunz-swram_hack/binary/Dunjun6",
]
driver = "versions/dunjunz-swram_hack/disassemble/disasm_dunjunz_swram_hack.py"
asm = "versions/dunjunz-swram_hack/output/dunjunz-swram_hack.asm"
json = "versions/dunjunz-swram_hack/output/dunjunz-swram_hack.json"

[[targets]]
id = "swram_hack-title"
binary = "versions/dunjunz-swram_hack/binary/TITLE"
driver = "versions/dunjunz-swram_hack/disassemble/disasm_dunjunz_swram_hack_title.py"
asm = "versions/dunjunz-swram_hack/output/dunjunz-swram_hack-title.asm"
json = "versions/dunjunz-swram_hack/output/dunjunz-swram_hack-title.json"

# Ole's crack of the cassette: DUNJ4 (the &0400-&2FFF image stored at
# &2400, plus start-up code at &5000) and DUNJ3 (&6E80 onwards); and
# EXPAND, the picture unpacker that PLOAD runs.
[[targets]]
id = "tape_crack_ole"
images = [
  "versions/dunjunz-tape_crack_ole/binary/DUNJ4",
  "versions/dunjunz-tape_crack_ole/binary/DUNJ3",
]
driver = "versions/dunjunz-tape_crack_ole/disassemble/disasm_dunjunz_tape_crack_ole.py"
asm = "versions/dunjunz-tape_crack_ole/output/dunjunz-tape_crack_ole.asm"
json = "versions/dunjunz-tape_crack_ole/output/dunjunz-tape_crack_ole.json"

[[targets]]
id = "tape_crack_ole-expand"
binary = "versions/dunjunz-tape_crack_ole/binary/EXPAND"
driver = "versions/dunjunz-tape_crack_ole/disassemble/disasm_dunjunz_tape_crack_ole_expand.py"
asm = "versions/dunjunz-tape_crack_ole/output/dunjunz-tape_crack_ole-expand.asm"
json = "versions/dunjunz-tape_crack_ole/output/dunjunz-tape_crack_ole-expand.json"

# The official disc release, Model B side: Dun1 (the game, reloaded every
# level) and Coder (its per-level loader, also stored inside Dun1, so the
# driver loads only Dun1 and saves Coder from it); then Dunjunz (the
# loader and title screen), *EDITOR (Editor) and *DEFAULT (Default).
[[targets]]
id = "disc"
images = [
  "versions/dunjunz-disc/binary/Dun1",
  "versions/dunjunz-disc/binary/Coder",
]
driver = "versions/dunjunz-disc/disassemble/disasm_dunjunz_disc.py"
asm = "versions/dunjunz-disc/output/dunjunz-disc.asm"
json = "versions/dunjunz-disc/output/dunjunz-disc.json"

[[targets]]
id = "disc-dunjunz"
binary = "versions/dunjunz-disc/binary/Dunjunz"
driver = "versions/dunjunz-disc/disassemble/disasm_dunjunz_disc_dunjunz.py"
asm = "versions/dunjunz-disc/output/dunjunz-disc-dunjunz.asm"
json = "versions/dunjunz-disc/output/dunjunz-disc-dunjunz.json"

[[targets]]
id = "disc-editor"
binary = "versions/dunjunz-disc/binary/Editor"
driver = "versions/dunjunz-disc/disassemble/disasm_dunjunz_disc_editor.py"
asm = "versions/dunjunz-disc/output/dunjunz-disc-editor.asm"
json = "versions/dunjunz-disc/output/dunjunz-disc-editor.json"

[[targets]]
id = "disc-default"
binary = "versions/dunjunz-disc/binary/Default"
driver = "versions/dunjunz-disc/disassemble/disasm_dunjunz_disc_default.py"
asm = "versions/dunjunz-disc/output/dunjunz-disc-default.asm"
json = "versions/dunjunz-disc/output/dunjunz-disc-default.json"

# The official disc release, Master 128 side: *DUNJUNZ (Dunjunz), Coder2,
# *DEFAULT (Default), *EDITOR (Editor), and the game, whose nine files
# (five at their run addresses, four in the Master's private RAM, HAZEL)
# make one listing.
[[targets]]
id = "disc_master-dunjunz"
binary = "versions/dunjunz-disc_master/binary/Dunjunz"
driver = "versions/dunjunz-disc_master/disassemble/disasm_dunjunz_disc_master_dunjunz.py"
asm = "versions/dunjunz-disc_master/output/dunjunz-disc_master-dunjunz.asm"
json = "versions/dunjunz-disc_master/output/dunjunz-disc_master-dunjunz.json"

[[targets]]
id = "disc_master-coder2"
binary = "versions/dunjunz-disc_master/binary/Coder2"
driver = "versions/dunjunz-disc_master/disassemble/disasm_dunjunz_disc_master_coder2.py"
asm = "versions/dunjunz-disc_master/output/dunjunz-disc_master-coder2.asm"
json = "versions/dunjunz-disc_master/output/dunjunz-disc_master-coder2.json"

[[targets]]
id = "disc_master-default"
binary = "versions/dunjunz-disc_master/binary/Default"
driver = "versions/dunjunz-disc_master/disassemble/disasm_dunjunz_disc_master_default.py"
asm = "versions/dunjunz-disc_master/output/dunjunz-disc_master-default.asm"
json = "versions/dunjunz-disc_master/output/dunjunz-disc_master-default.json"

[[targets]]
id = "disc_master-editor"
binary = "versions/dunjunz-disc_master/binary/Editor"
driver = "versions/dunjunz-disc_master/disassemble/disasm_dunjunz_disc_master_editor.py"
asm = "versions/dunjunz-disc_master/output/dunjunz-disc_master-editor.asm"
json = "versions/dunjunz-disc_master/output/dunjunz-disc_master-editor.json"

[[targets]]
id = "disc_master"
images = [
  "versions/dunjunz-disc_master/binary/Coder",
  "versions/dunjunz-disc_master/binary/Dunj3",
  "versions/dunjunz-disc_master/binary/Dunj4",
  "versions/dunjunz-disc_master/binary/Dunj5",
  "versions/dunjunz-disc_master/binary/Dunj2",
  "versions/dunjunz-disc_master/binary/Code",
  "versions/dunjunz-disc_master/binary/Table",
  "versions/dunjunz-disc_master/binary/Code2",
  "versions/dunjunz-disc_master/binary/Code3",
]
driver = "versions/dunjunz-disc_master/disassemble/disasm_dunjunz_disc_master.py"
asm = "versions/dunjunz-disc_master/output/dunjunz-disc_master.asm"
json = "versions/dunjunz-disc_master/output/dunjunz-disc_master.json"
