binary = "versions/nvg-dunjunz-disc/binary/Coder"
driver = "versions/nvg-dunjunz-disc/disassemble/disasm_dunjunz_disc.py"
asm = "versions/nvg-dunjunz-disc/output/dunjunz-disc.asm"
