asm = "versions/dunjunz-disc/output/dunjunz-disc.asm"
json = "versions/dunjunz-disc/output/dunjunz-disc.json"
verify = { command = ["beebasm", "-i", "{asm}"], cwd = "{output_dirpath}", output = "Coder" }

# The official disc release, Master 128 side. Each program has its own
# driver and listing: *DUNJUNZ (Dunjunz), Coder2, *EDITOR (Editor),
# *DEFAULT (Default), and the game, whose nine files (five at their run
# addresses, four in the Master's private RAM, HAZEL) make one listing.

[[targets]]
id = "disc_master-dunjunz"
binary = "versions/dunjunz-disc_master/binary/Dunjunz"
driver = "versions/dunjunz-disc_master/disassemble/disasm_dunjunz_disc_master_dunjunz.py"
